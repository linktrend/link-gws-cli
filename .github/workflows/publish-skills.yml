name: Publish OpenClaw Skills
on:
  push:
    branches:
    - main
    paths:
    - skills/**
    - .github/workflows/publish-skills.yml
  pull_request:
    branches:
    - main
    paths:
    - skills/**
    - .github/workflows/publish-skills.yml
  workflow_dispatch: null
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '20'
    - name: Install ClawHub CLI
      run: npm i -g clawhub@0.7.0
    - name: Authenticate ClawHub
      env:
        CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
      run: "if [ -z \"$CLAWHUB_TOKEN\" ]; then\n  echo \"::error::CLAWHUB_TOKEN secret\
        \ is not set\"\n  exit 1\nfi\nclawhub login --token \"$CLAWHUB_TOKEN\"\n"
    - name: Publish skills
      run: "if [ \"${{ github.event_name }}\" = \"pull_request\" ]; then\n  clawhub\
        \ sync --root skills --all --dry-run\nelse\n  clawhub sync --root skills --all\n\
        fi\n"
